<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Faith Journey</title>
    <!--
      Single Page App fallback for GitHub Pages.
      GitHub Pages serves this file for any unknown path. This script
      encodes the requested path into a query string and redirects to the
      app root, where a matching snippet in index.html restores the route
      so the React Router can handle it. Based on rafgraph/spa-github-pages.
    -->
    <script type="text/javascript">
      // Number of path segments to keep as the base before the SPA route.
      // The app is served from /spirit-start-journey/, so keep 1 segment.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
