name: Apply Supabase Migrations

# Automatically applies database migrations in supabase/migrations/ to the
# linked Supabase project whenever migration files change on main (and can be
# run manually). This is the Supabase equivalent of auto-pushing Apps Script:
# it keeps the production database schema/seed in sync with the repo.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch: {}

# Avoid two migration runs racing against the same database.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail early if secrets are missing
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Mark the baseline migration as already applied
        # The first migration (20260316145021) uses CREATE TABLE without
        # IF NOT EXISTS and was already applied when the project was first set
        # up. "migration repair ... --status applied" records it in the remote
        # migration history WITHOUT re-running it, so db push only runs the
        # newer, idempotent migrations. Safe to repeat.
        run: supabase migration repair --status applied 20260316145021 || true

      - name: Push migrations
        run: supabase db push

      - name: Show remote migration status
        if: always()
        run: supabase migration list || true

      - name: Verify seeds
        # Post-migration sanity check. Two catalog tables MUST be populated or
        # the app's writes fail with foreign-key errors (23503):
        #   - lessons (>=19): completed_lessons.lesson_id -> lessons(id).
        #     If empty, completing a lesson fails and PROGRESS NEVER PERSISTS.
        #   - achievements (>=8): user_achievements.achievement_id ->
        #     achievements(id). If empty, journal/lesson writes are rolled back.
        # Fail the job loudly here instead of discovering it in the app.
        #
        # Runs through the Supabase Management API (v1 /database/query) so we
        # don't need the DB host/region or IPv6 (unavailable on the runner).
        run: |
          query_count() {
            local table="$1"
            local resp
            resp=$(curl -sS -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"select count(*)::int as n from public.${table};\"}")
            echo "$resp" | grep -oE '"n"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$' | head -1
          }
          fail=0
          for pair in "lessons:19" "achievements:8" "bible_plans:4"; do
            table="${pair%%:*}"; min="${pair##*:}"
            n=$(query_count "$table")
            echo "public.${table} rows: ${n:-<none>} (min ${min})"
            if [ -z "$n" ]; then
              echo "::warning::Could not read count for public.${table}; skipping its check."
              continue
            fi
            if [ "$n" -lt "$min" ]; then
              echo "::error::public.${table} has $n rows, expected >= ${min}. Seed did not apply correctly."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "Seed verification passed."
