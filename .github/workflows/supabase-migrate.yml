name: Apply Supabase Migrations

# Automatically applies database migrations in supabase/migrations/ to the
# linked Supabase project whenever migration files change on main (and can be
# run manually). This is the Supabase equivalent of auto-pushing Apps Script:
# it keeps the production database schema/seed in sync with the repo.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch: {}

# Avoid two migration runs racing against the same database.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail early if secrets are missing
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Mark the baseline migration as already applied
        # The first migration (20260316145021) uses CREATE TABLE without
        # IF NOT EXISTS and was already applied when the project was first set
        # up. "migration repair ... --status applied" records it in the remote
        # migration history WITHOUT re-running it, so db push only runs the
        # newer, idempotent migrations. Safe to repeat.
        run: supabase migration repair --status applied 20260316145021 || true

      - name: Push migrations
        run: supabase db push

      - name: Show remote migration status
        if: always()
        run: supabase migration list || true

      - name: Verify achievements seed
        # Post-migration sanity check: the achievement-unlock triggers require
        # the achievements catalog to be populated (8 rows). If it is missing
        # or incomplete, journal/lesson writes fail with a foreign-key error,
        # so fail the job loudly here instead of discovering it in the app.
        #
        # Runs the query through the Supabase Management API (v1 /database/query)
        # using the access token. This avoids needing the DB host/region or
        # IPv6 connectivity, which the GitHub runner lacks for direct psql.
        run: |
          RESP=$(curl -sS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"select count(*)::int as n from public.achievements;"}')
          echo "API response: $RESP"
          COUNT=$(echo "$RESP" | grep -oE '"n"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$' | head -1)
          echo "achievements rows: ${COUNT:-<none>}"
          if [ -z "$COUNT" ]; then
            echo "::warning::Could not parse achievements count from the Management API response; skipping strict verification."
            exit 0
          fi
          if [ "$COUNT" -lt 8 ]; then
            echo "::error::Expected at least 8 rows in public.achievements, found $COUNT. The seed migration did not apply correctly."
            exit 1
          fi
          echo "Seed verification passed ($COUNT rows)."
